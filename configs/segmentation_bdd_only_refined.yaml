model_name: unet
encoder_name: resnet34
num_classes: 2
epochs: 40
batch_size: 8
learning_rate: 0.0002
num_workers: 6
image_size: [512, 512]
amp: true
cudnn_benchmark: true
pin_memory: true
persistent_workers: true
prefetch_factor: 2
channels_last: false
matmul_precision: high
val_interval: 2
max_train_steps: 1200
max_val_steps: 200
seed: 42
mask_threshold: 0
resume_from: runs/segmentation_bdd_rugd_refined/best.pt
resume_optimizer: false
train_images: data/raw/bdd100k/bdd100k_images_100k/100k/train
train_masks: data/raw/bdd100k/bdd100k_drivable_maps/labels/train
val_images: data/raw/bdd100k/bdd100k_images_100k/100k/val
val_masks: data/raw/bdd100k/bdd100k_drivable_maps/labels/val
mask_suffix: _drivable_id.png
use_mask_list: true
positive_values: [1]
save_dir: runs/segmentation_bdd_only_refined
